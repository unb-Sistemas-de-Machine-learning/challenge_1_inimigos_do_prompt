services:
  - type: web
    name: inimigos-do-prompt-api
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: MODEL_BACKEND
        value: "huggingface_api"
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: HUGGINGFACE_API_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
